name: xamepage
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.1+815

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & Framework
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2

  # Networking & Deep Linking
  http: ^1.2.2
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  app_links: ^6.0.3
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

  # Firebase & Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  local_auth: ^2.3.0

  # Local Storage & System Utilities
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  receive_sharing_intent: ^1.6.8

  # Geolocation & Mapping
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Audio, Video & Assets
  cached_network_image: ^3.4.1
  audioplayers: ^6.1.0
  just_audio: ^0.9.40
  flutter_sound: ^9.10.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  video_player: ^2.9.2
  video_compress: ^3.1.2
  video_thumbnail: ^0.5.3
  better_player_enhanced: ^0.0.5
  flutter_webrtc: ^0.12.5
  wechat_assets_picker: ^9.1.0
  file_picker: ^8.1.3

  # UI, PDF, Notifications & Navigation
  go_router: ^14.3.0
  flutter_local_notifications: ^17.2.3
  flutter_contacts: ^1.1.8
  open_filex: ^4.5.0
  pdf: ^3.11.1
  pdfx: ^2.6.0
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
